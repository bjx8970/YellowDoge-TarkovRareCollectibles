name: Code Quality Check (SPT 4.0)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'SPT 4.0/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'SPT 4.0/**'

jobs:
  code-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: ./SPT\ 4.0
        run: dotnet restore

      - name: Analyze Code (Build with Warnings)
        working-directory: ./SPT\ 4.0
        run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=true

      - name: Run Unit Tests (if any)
        working-directory: ./SPT\ 4.0
        continue-on-error: true
        run: |
          if [ -f "*.Tests.csproj" ]; then
            dotnet test --configuration Release --no-build --verbosity normal
          else
            echo "No test projects found"
          fi

      - name: Generate Build Report
        working-directory: ./SPT\ 4.0
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project: TarkovRareCollectibles (SPT 4.0)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- .NET Version: 9.0" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: SPT\ 4.0/bin/Release/**/*.log
          retention-days: 7
